<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDU Manager</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 900; margin: 0; color: #00e676; }
        .header p { font-size: 12px; color: #888; margin: 5px 0 0; }

        .login-box { background: #1a1a1a; padding: 20px; border-radius: 16px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .login-box input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0f0f0f; color: #fff; font-size: 16px; }
        .login-box button { padding: 12px; border-radius: 8px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        .login-box button:disabled { background: #333; color: #666; cursor: not-allowed; }

        #main-screen { display: none; width: 100%; max-width: 600px; }

        .tabs { display: flex; background: #1a1a1a; border-radius: 10px; padding: 4px; margin-bottom: 20px; width: 100%; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; color: #777; cursor: pointer; border-radius: 8px; transition: 0.3s; white-space: nowrap; }
        .tab.active { color: #fff; background: #2a2a2a; }

        .section { display: none; }
        .section.active { display: block; }

        .periods { display: flex; background: #1a1a1a; border-radius: 8px; padding: 4px; margin-bottom: 15px; }
        .period { flex: 1; padding: 6px; text-align: center; font-size: 11px; font-weight: 600; color: #666; cursor: pointer; border-radius: 6px; }
        .period.active { color: #fff; background: #2a2a2a; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #1a1a1a; padding: 12px; border-radius: 12px; border-top: 3px solid transparent; display: flex; flex-direction: column; align-items: center; text-align: center; }

        .card.top-1 { border-top-color: #ffd700; background: linear-gradient(145deg, #2a1f2d, #1a1a1a); }
        .card.top-1 .name { color: #ffd700; }
        .card.top-2 { border-top-color: #c0c0c0; background: linear-gradient(145deg, #1e2226, #1a1a1a); }
        .card.top-2 .name { color: #c0c0c0; }
        .card.top-3 { border-top-color: #cd7f32; background: linear-gradient(145deg, #281b14, #1a1a1a); }
        .card.top-3 .name { color: #cd7f32; }

        .name { font-size: 14px; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .val { font-size: 16px; font-weight: 900; color: #00e676; }
        #logout-btn { margin-top: 20px; padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ABDU Manager</h1>
        <p>Статистика в реальном времени</p>
    </div>

    <!-- Экран входа -->
    <div id="login-screen" class="login-box">
        <input type="number" id="login-id" placeholder="Твой Telegram ID" />
        <button id="btn-send" onclick="sendCode()">Получить код</button>
        <input type="text" id="login-code" placeholder="Введи код из ЛС" style="display: none;" />
        <button id="btn-verify" onclick="verifyCode()" style="display: none;">Войти</button>
        <div id="login-status" style="color: #888; font-size: 12px; text-align: center;"></div>
    </div>

    <!-- Экран статистики -->
    <div id="main-screen">
        <div class="tabs">
            <div class="tab active" onclick="showSection('sales', this)">💎 Генки</div>
            <div class="tab" onclick="showSection('tasks', this)">📦 Таски</div>
            <div class="tab" onclick="showSection('milk', this)">🥛 Молоко</div>
            <div class="tab" onclick="showSection('top', this)">🏆 Топ</div>
        </div>
        <div id="section-sales" class="section active">
            <div class="periods" id="periods-sales">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-sales" class="grid"></div>
        </div>
        <div id="section-tasks" class="section">
            <div class="periods" id="periods-tasks">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-tasks" class="grid"></div>
        </div>
        <div id="section-milk" class="section">
            <div class="periods" id="periods-milk">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-milk" class="grid"></div>
        </div>
        <div id="section-top" class="section">
            <div class="periods" id="periods-top">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-top" class="grid"></div>
        </div>
        <button id="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <script>
        const API_URL = "http://144.31.28.21:8000"; // Замени на реальный IP сервера
        let isAuthorized = false;
        let userId = null;
        let data = {};
        let currentSection = 'sales';
        let currentPeriod = 'today';

        // Проверяем сохраненный токен
        const savedToken = localStorage.getItem('auth_token');
        if (savedToken) {
            userId = parseInt(savedToken);
            isAuthorized = true;
            showMainScreen();
            loadData();
        }

        async function sendCode() {
            const id = document.getElementById('login-id').value;
            if (!id) return alert('Введи ID');
            document.getElementById('login-status').textContent = 'Отправляю...';
            try {
                const res = await fetch(API_URL + '/api/send_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: parseInt(id)})
                });
                const json = await res.json();
                if (res.ok) {
                    document.getElementById('login-code').style.display = 'block';
                    document.getElementById('btn-verify').style.display = 'block';
                    document.getElementById('login-status').textContent = 'Код отправлен в ЛС';
                    userId = parseInt(id);
                } else {
                    document.getElementById('login-status').textContent = json.detail || 'Ошибка';
                }
            } catch (e) {
                document.getElementById('login-status').textContent = 'Сервер недоступен';
            }
        }

        async function verifyCode() {
            const code = document.getElementById('login-code').value;
            if (!code) return alert('Введи код');
            document.getElementById('login-status').textContent = 'Проверяю...';
            try {
                const res = await fetch(API_URL + '/api/verify_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, code: code})
                });
                const json = await res.json();
                if (res.ok) {
                    localStorage.setItem('auth_token', json.token);
                    isAuthorized = true;
                    showMainScreen();
                    loadData();
                } else {
                    document.getElementById('login-status').textContent = json.detail || 'Ошибка';
                }
            } catch (e) {
                document.getElementById('login-status').textContent = 'Сервер недоступен';
            }
        }

        function showMainScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('auth_token');
            location.reload();
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                data = await res.json();
                render();
            } catch (e) { console.error(e); }
        }

        function showSection(s, el) {
            currentSection = s;
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('section-' + s).classList.add('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function setPeriod(p, el) {
            currentPeriod = p;
            el.parentElement.querySelectorAll('.period').forEach(per => per.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function render() {
            if (currentSection === 'tasks') {
                renderTasks();
            } else {
                renderCards();
            }
        }

        function renderCards() {
            const grid = document.getElementById('grid-' + currentSection);
            if (!data[currentPeriod]) { grid.innerHTML = '<div style="color:#666; grid-column:1/-1; text-align:center;">Нет данных</div>'; return; }
            const items = data[currentPeriod][currentSection] || [];
            let html = '';
            for (let i = 0; i < items.length; i++) {
                html += `<div class="card top-${i+1}"><div class="name">${items[i].name}</div><div class="val">${items[i].val.toLocaleString('ru-RU')} ген.</div></div>`;
            }
            if (!html) html = '<div style="color:#666; grid-column:1/-1; text-align:center;">Пусто</div>';
            grid.innerHTML = html;
        }

        function renderTasks() {
            const grid = document.getElementById('grid-tasks');
            if (!data[currentPeriod]) { grid.innerHTML = '<div style="color:#666; grid-column:1/-1; text-align:center;">Нет данных</div>'; return; }
            const items = data[currentPeriod].tasks || [];
            let html = '';
            for (let i = 0; i < items.length; i++) {
                html += `<div class="card top-${i+1}"><div class="name">${items[i].name}</div><div class="val">${items[i].amount.toLocaleString('ru-RU')} шт. / ${items[i].money.toLocaleString('ru-RU')} 💰</div></div>`;
            }
            if (!html) html = '<div style="color:#666; grid-column:1/-1; text-align:center;">Пусто</div>';
            grid.innerHTML = html;
        }

        setInterval(() => { if (isAuthorized) loadData(); }, 60000);
    </script>
</body>
</html>
