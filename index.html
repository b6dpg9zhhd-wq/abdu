<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDU Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        
        .login-box { background: #1a1a1a; padding: 20px; border-radius: 16px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; margin-top: 50px; }
        .login-box h2 { text-align: center; margin: 0 0 10px; color: #00e676; }
        .login-box input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0f0f0f; color: #fff; font-size: 16px; }
        .login-box button { padding: 12px; border-radius: 8px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        .login-box button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #login-status { color: #888; font-size: 12px; text-align: center; }

        #main-screen { display: none; width: 100%; max-width: 600px; }
        .top-bar { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
        .title { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.5px; margin-bottom: 2px; }
        .subtitle { font-size: 10px; font-weight: 800; color: #00e676; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .tabs { display: flex; background: #1a1a1a; border-radius: 10px; padding: 4px; margin-bottom: 16px; width: 100%; overflow-x: auto; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 600; color: #777; cursor: pointer; border-radius: 8px; transition: 0.3s; white-space: nowrap; }
        .tab.active { color: #fff; background: #2a2a2a; }
        
        .periods { display: flex; background: #1a1a1a; border-radius: 8px; padding: 4px; margin-bottom: 16px; width: 100%; }
        .period { flex: 1; padding: 8px 0; text-align: center; font-size: 11px; font-weight: 700; color: #666; cursor: pointer; border-radius: 6px; }
        .period.active { color: #fff; background: #2a2a2a; }

        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-bottom: 16px; align-items: start; }
        .grid .card:last-child:nth-child(odd) { grid-column: 1 / -1; width: calc(50% - 4px); justify-self: center; }
        
        .card { display: flex; flex-direction: column; background: #1a1a1a; padding: 10px; border-radius: 12px; border-top: 3px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        
        .card-top { display: flex; align-items: center; margin-bottom: 10px; }
        .avatar-box { width: 45px; height: 45px; border-radius: 50%; overflow: hidden; border: 2px solid; margin-right: 10px; flex-shrink: 0; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { display: flex; flex-direction: column; overflow: hidden; }
        .name { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .val { font-size: 12px; font-weight: 700; color: #888; }
        
        .compliment-box { position: relative; font-size: 9px; font-weight: 600; color: #aaa; background: rgba(255,255,255,0.05); border-radius: 0 6px 6px 0; border-left: 3px solid; padding: 8px 20px 8px 8px; text-align: left; width: 100%; font-style: italic; line-height: 1.3; word-break: break-word; box-sizing: border-box; }
        .quote-mark { position: absolute; top: 0px; right: 6px; font-size: 18px; font-weight: 900; line-height: 1; font-family: Georgia, serif; }
        
        .card.top-1 { background: linear-gradient(145deg, #2a1f2d, #1a1a1a); }
        .card.top-2 { background: linear-gradient(145deg, #1e2226, #1a1a1a); }
        .card.top-3 { background: linear-gradient(145deg, #281b14, #1a1a1a); }

        /* Календарь */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-cell { aspect-ratio: 1/1; background: #1a1a1a; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; position: relative; }
        .calendar-cell.empty { background: transparent; }
        .calendar-cell.c-gray { background: #2a2a2a; }
        .calendar-cell.c-red { background: #ef5350; }
        .calendar-cell.c-orange { background: #ff9100; }
        .calendar-cell.c-yellow { background: #ffd600; color: #000; }
        .calendar-cell.c-green { background: #00e676; color: #000; }

        .footer { margin-top: 20px; font-size: 12px; font-weight: 600; color: #00e676; text-align: center; }
        
        #logout-btn { margin-top: 20px; padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        
        .chart-container { width: 100%; height: 250px; background: #1a1a1a; border-radius: 12px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="login-screen" class="login-box">
        <h2>Вход в ABDU</h2>
        <input type="number" id="login-id" placeholder="Твой Telegram ID" />
        <button onclick="sendCode()">Получить код</button>
        <input type="text" id="login-code" placeholder="Код из ЛС" style="display: none;" />
        <button onclick="verifyCode()" style="display: none;">Войти</button>
        <div id="login-status"></div>
    </div>

    <div id="main-screen">
        <div class="top-bar">
            <div class="title">ABDU Manager</div>
            <div class="subtitle">Статистика</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="showSection('sales', this)">💎 Генки</div>
            <div class="tab" onclick="showSection('tasks', this)">📦 Таски</div>
            <div class="tab" onclick="showSection('milk', this)">🥛 Молоко</div>
            <div class="tab" onclick="showSection('graph', this)">📈 График</div>
            <div class="tab" onclick="showSection('calendar', this)">📅 Календарь</div>
        </div>
        
        <div id="section-sales" class="section active">
            <div class="periods" id="periods-sales">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-sales" class="grid"></div>
        </div>
        
        <div id="section-tasks" class="section" style="display: none;">
            <div class="periods" id="periods-tasks">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-tasks" class="grid"></div>
        </div>

        <div id="section-milk" class="section" style="display: none;">
            <div class="periods" id="periods-milk">
                <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
                <div class="period" onclick="setPeriod('week', this)">Неделя</div>
                <div class="period" onclick="setPeriod('month', this)">Месяц</div>
                <div class="period" onclick="setPeriod('all', this)">Всё</div>
            </div>
            <div id="grid-milk" class="grid"></div>
        </div>

        <div id="section-graph" class="section" style="display: none;">
            <div class="periods" id="periods-graph">
                <div class="period active" onclick="drawChart('today', this)">Сутки</div>
                <div class="period" onclick="drawChart('week', this)">Неделя</div>
                <div class="period" onclick="drawChart('month', this)">Месяц</div>
            </div>
            <div class="chart-container"><canvas id="myChart"></canvas></div>
        </div>

        <div id="section-calendar" class="section" style="display: none;">
            <div class="periods" id="periods-calendar">
                <div class="period active" onclick="drawCalendar(0, this)">Текущий</div>
            </div>
            <div id="calendar-title" style="text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px;"></div>
            <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <div class="footer">Мур-мур, вы лучшие! 🐾</div>
        <button id="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <script>
        const API_URL = "https://moreover-your-all-ash.trycloudflare.com";
        let isAuthorized = false;
        let userId = null;
        let data = {};
        let currentSection = 'sales';
        let currentPeriod = 'today';
        let chart = null;

        const savedToken = localStorage.getItem('auth_token');
        if (savedToken) {
            userId = parseInt(savedToken);
            isAuthorized = true;
            showMainScreen();
            loadData();
        }

        async function sendCode() {
            const id = document.getElementById('login-id').value;
            if (!id) return alert('Введи ID');
            document.getElementById('login-status').textContent = 'Отправляю...';
            try {
                const res = await fetch(API_URL + '/api/send_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: parseInt(id)})
                });
                const json = await res.json();
                if (res.ok) {
                    document.getElementById('login-code').style.display = 'block';
                    document.querySelectorAll('.login-box button')[1].style.display = 'block';
                    document.getElementById('login-status').textContent = 'Код отправлен в ЛС';
                    userId = parseInt(id);
                } else {
                    document.getElementById('login-status').textContent = json.detail || 'Ошибка';
                }
            } catch (e) {
                document.getElementById('login-status').textContent = 'Сервер недоступен';
            }
        }

        async function verifyCode() {
            const code = document.getElementById('login-code').value;
            if (!code) return alert('Введи код');
            document.getElementById('login-status').textContent = 'Проверяю...';
            try {
                const res = await fetch(API_URL + '/api/verify_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, code: code})
                });
                const json = await res.json();
                if (res.ok) {
                    localStorage.setItem('auth_token', json.token);
                    isAuthorized = true;
                    showMainScreen();
                    loadData();
                } else {
                    document.getElementById('login-status').textContent = json.detail || 'Ошибка';
                }
            } catch (e) {
                document.getElementById('login-status').textContent = 'Сервер недоступен';
            }
        }

        function showMainScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('auth_token');
            location.reload();
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                data = await res.json();
                render();
                if (currentSection === 'graph') drawChart(currentPeriod);
                if (currentSection === 'calendar') drawCalendar(0);
            } catch (e) { console.error(e); }
        }

        function showSection(s, el) {
            currentSection = s;
            document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
            document.getElementById('section-' + s).style.display = 'block';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            render();
            if (s === 'graph') drawChart(currentPeriod);
            if (s === 'calendar') drawCalendar(0);
        }

        function setPeriod(p, el) {
            currentPeriod = p;
            el.parentElement.querySelectorAll('.period').forEach(per => per.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function render() {
            if (currentSection === 'tasks') renderTasks();
            else if (currentSection === 'sales' || currentSection === 'milk') renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('grid-' + currentSection);
            if (!data[currentPeriod]) { grid.innerHTML = ''; return; }
            const items = data[currentPeriod][currentSection] || [];
            let html = '';
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const border = ["#ffd700", "#c0c0c0", "#cd7f32", "#333", "#333"][i];
                const comp = getCompliment(item.name);
                html += `<div class="card top-${i+1}">
                    <div class="card-top">
                        <div class="avatar-box" style="border-color: ${border};"><img src="${item.ava}" alt=""></div>
                        <div class="info">
                            <div class="name" style="color: ${border};">${item.name}</div>
                            <div class="val">${item.val.toLocaleString('ru-RU')} ген.</div>
                        </div>
                    </div>
                    <div class="compliment-box" style="border-left-color: ${border};">
                        <span class="quote-mark" style="color: ${border};">”</span>${comp}
                    </div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function renderTasks() {
            const grid = document.getElementById('grid-tasks');
            if (!data[currentPeriod]) { grid.innerHTML = ''; return; }
            const items = data[currentPeriod].tasks || [];
            let html = '';
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const border = ["#ffd700", "#c0c0c0", "#cd7f32", "#333", "#333"][i];
                html += `<div class="card top-${i+1}">
                    <div class="name" style="color: ${border}; font-size: 16px;">${item.name}</div>
                    <div class="val" style="margin-top: 8px;">${item.amount.toLocaleString('ru-RU')} шт. <br> ${item.money.toLocaleString('ru-RU')} 💰</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function drawChart(period, el) {
            if (el) {
                currentPeriod = period;
                document.querySelectorAll('#periods-graph .period').forEach(p => p.classList.remove('active'));
                el.classList.add('active');
            }
            if (!data[period] || !data[period].graph) return;
            
            const ctx = document.getElementById('myChart').getContext('2d');
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data[period].graph.labels,
                    datasets: [{
                        label: 'Генерации',
                        data: data[period].graph.values,
                        borderColor: '#00e676',
                        backgroundColor: 'rgba(0, 230, 118, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#222' }, ticks: { color: '#888' } },
                        y: { grid: { color: '#222' }, ticks: { color: '#888' } }
                    }
                }
            });
        }

        function drawCalendar(offset, el) {
            if (el) {
                document.querySelectorAll('#periods-calendar .period').forEach(p => p.classList.remove('active'));
                el.classList.add('active');
            }
            if (!data["today"] || !data["today"].calendar) return;
            
            const cal = data["today"].calendar;
            document.getElementById('calendar-title').textContent = cal.title;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            cal.days.forEach(d => {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell ' + (d.day ? 'c-' + d.color : 'empty');
                cell.textContent = d.day || '';
                grid.appendChild(cell);
            });
        }

        function getCompliment(name) {
            const comps = ["Гений генераций 🧠", "Машина мощности 🚀", "Король скорости ⚡", "Мастер стратегии ♟️", "Звезда чата ⭐", "Легенда генераций 🔥", "Просто космос 🌌", "Неудержимый поток 💥", "Топ по мозгам 🧠"];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = ((hash << 5) - hash) + name.charCodeAt(i);
            return comps[Math.abs(hash) % comps.length];
        }

        setInterval(() => { if (isAuthorized) loadData(); }, 60000);
    </script>
</body>
</html>
