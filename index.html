<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDU Manager</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 900; margin: 0; color: #00e676; }
        .header p { font-size: 12px; color: #888; margin: 5px 0 0; }
        
        .tabs { display: flex; background: #1a1a1a; border-radius: 10px; padding: 4px; margin-bottom: 20px; width: 100%; max-width: 600px; overflow-x: auto; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; color: #777; cursor: pointer; border-radius: 8px; transition: 0.3s; white-space: nowrap; }
        .tab.active { color: #fff; background: #2a2a2a; }
        
        .section { display: none; width: 100%; max-width: 600px; }
        .section.active { display: block; }
        
        .periods { display: flex; background: #1a1a1a; border-radius: 8px; padding: 4px; margin-bottom: 15px; }
        .period { flex: 1; padding: 6px; text-align: center; font-size: 11px; font-weight: 600; color: #666; cursor: pointer; border-radius: 6px; }
        .period.active { color: #fff; background: #2a2a2a; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #1a1a1a; padding: 12px; border-radius: 12px; border-top: 3px solid transparent; display: flex; flex-direction: column; align-items: center; text-align: center; }
        
        .card.top-1 { border-top-color: #ffd700; background: linear-gradient(145deg, #2a1f2d, #1a1a1a); }
        .card.top-1 .name { color: #ffd700; }
        .card.top-2 { border-top-color: #c0c0c0; background: linear-gradient(145deg, #1e2226, #1a1a1a); }
        .card.top-2 .name { color: #c0c0c0; }
        .card.top-3 { border-top-color: #cd7f32; background: linear-gradient(145deg, #281b14, #1a1a1a); }
        .card.top-3 .name { color: #cd7f32; }
        
        .name { font-size: 14px; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .val { font-size: 16px; font-weight: 900; color: #00e676; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ABDU Manager</h1>
        <p>Статистика в реальном времени</p>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="showSection('sales', this)">💎 Генки</div>
        <div class="tab" onclick="showSection('tasks', this)">📦 Таски</div>
        <div class="tab" onclick="showSection('milk', this)">🥛 Молоко</div>
        <div class="tab" onclick="showSection('top', this)">🏆 Топ</div>
    </div>
    
    <div id="section-sales" class="section active">
        <div class="periods" id="periods-sales">
            <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
            <div class="period" onclick="setPeriod('week', this)">Неделя</div>
            <div class="period" onclick="setPeriod('month', this)">Месяц</div>
            <div class="period" onclick="setPeriod('all', this)">Всё</div>
        </div>
        <div id="grid-sales" class="grid"></div>
    </div>
    
    <div id="section-tasks" class="section">
        <div class="periods" id="periods-tasks">
            <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
            <div class="period" onclick="setPeriod('week', this)">Неделя</div>
            <div class="period" onclick="setPeriod('month', this)">Месяц</div>
            <div class="period" onclick="setPeriod('all', this)">Всё</div>
        </div>
        <div id="grid-tasks" class="grid"></div>
    </div>
    
    <div id="section-milk" class="section">
        <div class="periods" id="periods-milk">
            <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
            <div class="period" onclick="setPeriod('week', this)">Неделя</div>
            <div class="period" onclick="setPeriod('month', this)">Месяц</div>
            <div class="period" onclick="setPeriod('all', this)">Всё</div>
        </div>
        <div id="grid-milk" class="grid"></div>
    </div>
    
    <div id="section-top" class="section">
        <div class="periods" id="periods-top">
            <div class="period active" onclick="setPeriod('today', this)">Сутки</div>
            <div class="period" onclick="setPeriod('week', this)">Неделя</div>
            <div class="period" onclick="setPeriod('month', this)">Месяц</div>
            <div class="period" onclick="setPeriod('all', this)">Всё</div>
        </div>
        <div id="grid-top" class="grid"></div>
    </div>
    
    <script>
        let data = {};
        let currentSection = 'sales';
        let currentPeriod = 'today';

        async function loadData() {
            const res = await fetch('data.json?t=' + Date.now());
            data = await res.json();
            render();
        }

        function showSection(s, el) {
            currentSection = s;
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('section-' + s).classList.add('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function setPeriod(p, el) {
            currentPeriod = p;
            document.querySelectorAll('.periods').forEach(ps => {
                ps.querySelectorAll('.period').forEach(per => per.classList.remove('active'));
            });
            el.classList.add('active');
            render();
        }

        function render() {
            if (currentSection === 'tasks') {
                renderTasks();
            } else {
                renderCards();
            }
        }

        function renderCards() {
            const grid = document.getElementById('grid-' + currentSection);
            const items = data[currentPeriod] ? data[currentPeriod][currentSection] || [] : [];
            let html = '';
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                html += `<div class="card top-${i+1}">
                    <div class="name">${item.name}</div>
                    <div class="val">${item.val.toLocaleString('ru-RU')} ген.</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function renderTasks() {
            const grid = document.getElementById('grid-tasks');
            const items = data[currentPeriod] ? data[currentPeriod].tasks || [] : [];
            let html = '';
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                html += `<div class="card top-${i+1}">
                    <div class="name">${item.name}</div>
                    <div class="val">${item.amount.toLocaleString('ru-RU')} шт. / ${item.money.toLocaleString('ru-RU')} 💰</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        loadData();
        setInterval(loadData, 60000); // Обновление раз в минуту
    </script>
</body>
</html>
