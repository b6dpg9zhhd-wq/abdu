
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топ ABDU</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        .title { text-align: center; font-size: 20px; font-weight: 900; margin-bottom: 5px; color: #fff; }
        .subtitle { text-align: center; font-size: 10px; color: #00e676; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 500px; margin: 0 auto; }
        .card { display: flex; flex-direction: column; align-items: center; background: #1a1a1a; padding: 12px 10px; border-radius: 16px; border-top: 3px solid #333; position: relative; }
        
        .card:nth-child(5) { grid-column: 1 / -1; width: calc(50% - 5px); justify-self: center; }
        
        .card.top-1 { border-top-color: #ffd700; background: linear-gradient(145deg, #2a1f2d, #1a1a1a); }
        .card.top-1 .name { color: #ffd700; }
        .card.top-1 .ava { border-color: #ffd700; }
        
        .card.top-2 { border-top-color: #c0c0c0; background: linear-gradient(145deg, #1e2226, #1a1a1a); }
        .card.top-2 .name { color: #c0c0c0; }
        .card.top-2 .ava { border-color: #c0c0c0; }
        
        .card.top-3 { border-top-color: #cd7f32; background: linear-gradient(145deg, #281b14, #1a1a1a); }
        .card.top-3 .name { color: #cd7f32; }
        .card.top-3 .ava { border-color: #cd7f32; }
        
        .ava { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 8px; background: #333; overflow: hidden; border: 2px solid #444; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .ava img { width: 100%; height: 100%; object-fit: cover; }
        
        .name { font-size: 13px; font-weight: 800; margin-bottom: 2px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .val { font-size: 15px; font-weight: 900; color: #00e676; margin-bottom: 6px; }
        
        .badge { font-size: 9px; font-weight: 700; color: #888; background: #222; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="title">Топ по генерациям</div>
    <div class="subtitle">За всё время</div>
    
    <div class="grid">
        
    <div class="card top-1">
        <div class="ava"><img src="avatars/6432107633.webp" alt="アsweettnex🐮"></div>
        <div class="name">アsweettnex🐮</div>
        <div class="val">906 ген.</div>
        <div class="badge">Мастер</div>
    </div>
    
    <div class="card top-2">
        <div class="ava"><img src="avatars/511143262.webp" alt="Лена 🐮🕊🍒"></div>
        <div class="name">Лена 🐮🕊🍒</div>
        <div class="val">485 ген.</div>
        <div class="badge">Легенда</div>
    </div>
    
    <div class="card top-3">
        <div class="ava"><img src="avatars/6910401960.webp" alt="Миша 🐮"></div>
        <div class="name">Миша 🐮</div>
        <div class="val">436 ген.</div>
        <div class="badge">Ракета</div>
    </div>
    
    <div class="card top-4">
        <div class="ava"><img src="avatars/8277341084.webp" alt="настя 🐈‍⬛🐮"></div>
        <div class="name">настя 🐈‍⬛🐮</div>
        <div class="val">404 ген.</div>
        <div class="badge">Огонь</div>
    </div>
    
    <div class="card top-5">
        <div class="ava"><img src="avatars/7529319304.webp" alt="💜Милашка💜🐮"></div>
        <div class="name">💜Милашка💜🐮</div>
        <div class="val">362 ген.</div>
        <div class="badge">Гений</div>
    </div>
    
    </div>
</body>
</html>
